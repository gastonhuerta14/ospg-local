<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OSPG · Cruce de Compras</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.datatables.net/1.13.5/css/dataTables.bootstrap5.min.css" rel="stylesheet">
  <link href="css/estilos.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar topbar px-3 d-flex justify-content-between">
    <span class="navbar-brand mb-0 h1 text-white">OSPG · Cruce de Compras</span>
    <div class="d-flex align-items-center text-white">
      <span class="me-3">Período: <strong id="periodoActual">—</strong></span>
      <button class="btn btn-sm btn-light me-3" id="btnActualizar">⟳ Actualizar</button>
      <span id="userEmail">Conectando…</span>
    </div>
  </nav>

  <div class="d-flex" style="height: calc(100vh - 56px);">
    <div class="sidebar p-3">
      <ul class="nav flex-column">
        <li class="nav-item"><a class="nav-link active" href="#" id="nav-dashboard">▣ Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="#" id="nav-ingesta">⇅ Ingesta</a></li>
        <li class="nav-item"><a class="nav-link text-warning" href="#" id="nav-revision">⚠ Revisión (<span id="count-revision">0</span>)</a></li>
        <li class="nav-item"><a class="nav-link" href="#" id="nav-diccionario">📖 Diccionario</a></li>
      </ul>
    </div>

    <div class="content p-4 w-100" style="overflow-y:auto; background-color: var(--page-plane);">
      <div id="app-content">
        <div class="text-center mt-5"><div class="spinner-border text-primary"></div></div>
      </div>
    </div>
  </div>

  <!-- Sin <?!= include(...) ?>: en Node son archivos estáticos comunes.
       El orden importa: core.js define llamar() e irA(), que usan los demás. -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.5/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.5/js/dataTables.bootstrap5.min.js"></script>

  <script src="js/tabla.js"></script>
  <script src="js/ingesta.js"></script>
  <script src="js/revision.js"></script>
  <script src="js/core.js"></script>
</body>
</html>
